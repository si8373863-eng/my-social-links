<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shahidul Islam | Social & Services</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at top,#173b5e,#07111d 55%,#02070c);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    padding:30px 20px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.profile{
    width:110px;
    height:110px;
    margin:0 auto 15px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid #fff;
    box-shadow:0 0 25px rgba(255,255,255,.35);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:25px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.links a{
    text-decoration:none;
    color:#fff;
    padding:15px;
    border-radius:14px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.15);
    transition:.3s;
}

.links a:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.22);
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="card">

    <!-- Profile Picture -->
    <div class="profile">
        <img src="Profile.jpg" alt="Shahidul Islam">
    </div>

    <h1>Shahidul Islam</h1>

    <p class="subtitle">
        Social Media & Services
    </p>

    <div class="links">
        <a href="#" target="_blank">📘 Facebook</a>
        <a href="#" target="_blank">📱 WhatsApp</a>
        <a href="#" target="_blank">▶️ YouTube</a>
        <a href="#" target="_blank">📷 Instagram</a>
        <a href="#" target="_blank">💬 Contact Me</a>
    </div>

    <div class="footer">
        © 2026 Shahidul Islam
    </div>

</div>

</body>
</html>
