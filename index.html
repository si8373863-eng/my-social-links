<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shahidul Islam | Social & Services</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at top,#193b5a 0%,#07121d 45%,#02070c 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    text-align:center;
    padding:30px 20px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
    margin-bottom:15px;
}

h1{
    font-size:28px;
    margin-bottom:7px;
}

.subtitle{
    color:#c9d7e5;
    margin-bottom:20px;
}

.services{
    background:rgba(255,255,255,.08);
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
}

.services h2{
    font-size:18px;
    margin-bottom:8px;
}

.services p{
    color:#d8e4ee;
    line-height:1.6;
}

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.links a{
    text-decoration:none;
    color:#fff;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.12);
    font-size:17px;
    font-weight:bold;
    transition:.25s;
}

.links a:hover{
    transform:scale(1.03);
    background:rgba(255,255,255,.2);
}

.footer{
    margin-top:20px;
    color:#9fb2c3;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

    <!-- PROFILE PHOTO -->
    <!-- আপনার GitHub-এ Profile.jpg থাকলে নিচের লিংকটি ঠিক করে দিন -->
    <img src="Profile.jpg" alt="Shahidul Islam" class="profile">

    <h1>Shahidul Islam</h1>

    <p class="subtitle">
        Epoxy Floor & Self Leveling Specialist
    </p>

    <div class="services">
        <h2>My Services</h2>
        <p>
            Epoxy Floor<br>
            Self Leveling<br>
            Floor Coating & Finishing
        </p>
    </div>

    <div class="links">

        <!-- FACEBOOK -->
        <a href="https://www.facebook.com/shahidul.islam.875751"
           target="_blank">
            📘 Facebook
        </a>

        <!-- TIKTOK -->
        <a href="https://www.tiktok.com/@shahidulislam8022"
           target="_blank">
            🎵 TikTok
        </a>

        <!-- WHATSAPP -->
        <a href="https://wa.me/966578608364"
           target="_blank">
            💬 WhatsApp
        </a>

        <!-- PHONE -->
        <a href="tel:+966578608364">
            📞 Call Me
        </a>

    </div>

    <div class="footer">
        © 2026 Shahidul Islam
    </div>

</div>

</body>
</html>
